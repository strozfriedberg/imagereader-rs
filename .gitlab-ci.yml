---
default:
  # Cannot use slim, as ssl and crypto are missing: openssl-sys comes in via
  # rust-s3 and needs the headers.
  image: rust:latest
  before_script:
    - test -x "$CARGO_HOME/bin/sccache" || cargo install sccache
    - export "PATH=$CARGO_HOME/bin:$PATH"
    - export RUSTC_WRAPPER="$CARGO_HOME/bin/sccache"
    - rustc --version
    - cargo --version
    - sccache --version

stages:
  - build
  - test

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TARGET_DIR: $CI_PROJECT_DIR/target
  FF_USE_FASTZIP: true
  CACHE_COMPRESSION_LEVEL: "fast"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  TRANSFER_METER_FREQUENCY: "2s"
  CACHE_COMPRESSION_FORMAT: "zip"

build:
  stage: build
  needs: []
  variables:
    SCCACHE_DIR: $CI_PROJECT_DIR/.sccache-test
  cache:
    - key: "sccache-v1-test"
      paths:
        - .sccache-test/
      policy: pull-push
    - key: "cargo-v2"
      paths:
        - .cargo/registry/index/
        - .cargo/registry/cache/
        - .cargo/git/db/
      policy: pull-push
    - key: "cargo-bin-sccache"
      paths:
        - .cargo/bin/sccache
      policy: pull-push
  script:
    - cargo build --workspace --all-targets --all-features --locked
    - sccache --show-stats

test:
  stage: test
  needs:
    - job: build
      artifacts: false
  variables:
    SCCACHE_DIR: $CI_PROJECT_DIR/.sccache-test
  cache:
    - key: "sccache-v1-test"
      paths:
        - .sccache-test/
      policy: pull
    - key: "cargo-v2"
      paths:
        - .cargo/registry/index/
        - .cargo/registry/cache/
        - .cargo/git/db/
      policy: pull
    - key: "cargo-bin-sccache"
      paths:
        - .cargo/bin/sccache
      policy: pull
  # --all-features covers the capi modules; --locked fails rather than silently
  # updating Cargo.lock; --tests skips doctests, of which there are none.
  script:
    - cargo test --workspace --all-features --locked --tests
    - sccache --show-stats

# Compiles nothing, so it skips the sccache setup and does not wait on build.
fmt:
  stage: test
  needs: []
  before_script: []
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check
