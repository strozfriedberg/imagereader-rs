name: CI
# When dispatched by asdf's nightly roll-up, echo its tag into the run name so
# the caller can find this run (workflow_dispatch returns no run id).
run-name: ${{ inputs.caller_run_id && format('CI ({0})', inputs.caller_run_id) || format('CI on {0}', github.ref_name) }}
on:
  pull_request:
  push:
    branches: [main] # post-merge safety net only; avoids duplicate runs on PR branches
  workflow_dispatch:
    inputs:
      caller_run_id:
        description: Tag from the calling workflow, echoed into run-name so the caller can locate this run.
        required: false
        default: ""
        type: string
concurrency:
  # Dispatched runs get their own group keyed by the caller's tag, so a push to
  # main can't cancel a nightly roll-up run mid-flight and report it as failed.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.caller_run_id || 'auto' }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy # required: not read from rust-toolchain.toml
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  # --all-features covers the capi modules; --tests skips doctests, of which
  # all six crates have none.
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          cache-on-failure: true
      - run: cargo build --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --locked --tests

  # The C API is built and exercised per crate, as cargo-c works one crate at a
  # time. This is the only thing that links the capi surface as a real C
  # library; `cargo test --all-features` only covers the Rust side of it.
  # ctest-capi.sh goes one step further and compiles each crate's c_api/test.c
  # against the installed headers, as C99 and as C++17, so a header that is
  # broken for one of the two languages fails here.
  ctest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          cache-on-failure: true
          cache-bin: true # keeps cargo-c out of a rebuild on every run
      - run: command -v cargo-ctest >/dev/null || cargo install cargo-c --locked
      - run: for crate in vmdk e01 rawdisk; do (cd "$crate" && cargo ctest); done
      - run: scripts/ctest-capi.sh

  # scripts/build-release.sh builds every binary and, through cargo-c, the C
  # libraries. It refuses to build a dirty tree so the embedded commit always
  # identifies the source. lto = true in the release profile, so this is slow;
  # nothing above waits on it.
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          cache-on-failure: true
          cache-bin: true # keeps cargo-c out of a rebuild on every run
      - run: command -v cargo-ctest >/dev/null || cargo install cargo-c --locked
      - run: scripts/build-release.sh
      # Only publish from main. PR runs and dispatched runs (including the asdf
      # nightly roll-up) still do the release build — they just don't upload,
      # so a stored artifact always corresponds to a commit on main.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: imagereader-${{ github.sha }}
          path: |
            target/release/e01verify
            target/release/e01bench
            target/release/vmdkverify
            target/release/rawdiskverify
            target/release/diskimage-nbd
            target/release/dist
          retention-days: 3
          if-no-files-found: error
