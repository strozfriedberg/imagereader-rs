name: CI
on:
  pull_request:
  push:
    branches: [main] # post-merge safety net only; avoids duplicate runs on PR branches
  schedule:
    - cron: "0 5 * * *" # nightly, an hour before asdf's, so a break here surfaces first
  workflow_dispatch:
concurrency:
  # Keyed by event as well as ref: a scheduled run and a push to main share a
  # ref, and cancel-in-progress would otherwise let one kill the other and
  # report it as failed.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy # required: not read from rust-toolchain.toml
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  # --all-features covers the capi modules; --tests skips doctests, of which
  # all six crates have none.
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          cache-on-failure: true
      - run: cargo build --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --locked --tests

  # The C API is built and exercised per crate, as cargo-c works one crate at a
  # time. This is the only thing that links the capi surface as a real C
  # library; `cargo test --all-features` only covers the Rust side of it.
  # ctest-capi.sh goes one step further and compiles each crate's c_api/test.c
  # against the installed headers, as C99 and as C++17, so a header that is
  # broken for one of the two languages fails here.
  ctest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          cache-on-failure: true
          cache-bin: true # keeps cargo-c out of a rebuild on every run
      - run: command -v cargo-ctest >/dev/null || cargo install cargo-c --locked
      - run: for crate in vmdk e01 rawdisk; do (cd "$crate" && cargo ctest); done
      - run: scripts/ctest-capi.sh

  # scripts/build-release.sh builds every binary and, through cargo-c, the C
  # libraries. lto = true in the release profile, so this is slow;
  # nothing above waits on it.
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # On a pull_request, github.sha is the synthetic refs/pull/N/merge commit,
      # which sits on no branch and is eventually garbage collected. Building it
      # would bake a commit into --version that nobody can ever check out, so
      # this job builds the branch tip instead. (lint/build-test/ctest keep
      # testing the merge result)
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_SHA }}
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          cache-on-failure: true
          cache-bin: true # keeps cargo-c out of a rebuild on every run
      - run: command -v cargo-ctest >/dev/null || cargo install cargo-c --locked
      - run: scripts/build-release.sh
      # Uploaded from every run, all branches included: a consumer testing a
      # cross-repo change needs a build of its branch, and this is our way of
      # making a build available. They have short retention, intended for a branch test
      # or the nightly CI build. Anything that must stay fetchable (a downstream pin)
      # uses a Release instead, published by release.yml on a tag; those assets never expire.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imagereader-${{ env.BUILD_SHA }}
          path: |
            target/release/e01verify
            target/release/e01bench
            target/release/vmdkverify
            target/release/rawdiskverify
            target/release/diskimage-nbd
            target/release/dist
          retention-days: 1
          if-no-files-found: error

  # Slack post for a nightly (or manually dispatched) run
  notify:
    needs: [lint, build-test, ctest, build-release]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Notify Slack
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          # A missing webhook must not turn the nightly red on its own — that
          # would report a configuration gap as a build failure.
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "::warning::SLACK_CI_WEBHOOK_URL is not set; skipping notification"
            exit 0
          fi
          if echo "$NEEDS_JSON" | jq -e \
            'to_entries | all(.value.result == "success" or .value.result == "skipped")' \
            > /dev/null; then
            PAYLOAD=$(jq -n --arg url "$RUN_URL" \
              '{text: (":fistpump_kid: imagereader-rs nightly CI succeeded\n" + $url)}')
          else
            FAILED=$(jq -r \
              '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' \
              <<< "$NEEDS_JSON")
            PAYLOAD=$(jq -n --arg failed "$FAILED" --arg url "$RUN_URL" \
              '{text: ("<!channel> :nuke: imagereader-rs nightly CI failed: " + $failed + "\n" + $url)}')
          fi
          curl -sS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$SLACK_WEBHOOK_URL"
