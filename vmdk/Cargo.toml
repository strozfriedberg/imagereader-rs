[package]
name = "vmdk-rs"
version = "0.1.1"
authors = ["LevelBlue"]
edition = "2024"

[lib]
name = "vmdkrs"
path = "src/lib.rs"

[[bin]]
name = "vmdkverify"
path = "src/main.rs"

[[bin]]
name = "open-timing"
path = "src/bin/open_timing.rs"

[features]
capi = []

[dependencies]
imagesource.workspace = true
byteorder = "1.5"
bytesize = "2.3.1"
clap = { version = "4.1.7", features = ["derive"] }
flate2 = "1"
futures.workspace = true
hex = "0.4.3"
regex = "1"
rust-s3.workspace = true
sha-1 = "^0.10"
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
rand = "0.10"
criterion = "0.7"

[[bench]]
name = "reader_bench"
path = "benches/reader_bench.rs"
harness = false

