[package]
name = "vmdk-rs"
version = "0.1.1"
authors = ["LevelBlue"]
edition = "2024"

[lib]
name = "vmdkrs"
path = "src/lib.rs"

[[bin]]
name = "vmdkverify"
path = "src/main.rs"

[features]
capi = []

[dependencies]
imagesource.workspace = true
byteorder = "1.5"
bytesize.workspace = true
clap.workspace = true
flate2 = "1"
hex.workspace = true
sha1.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
rand.workspace = true
criterion.workspace = true
tempfile.workspace = true

[[bench]]
name = "reader_bench"
path = "benches/reader_bench.rs"
harness = false
